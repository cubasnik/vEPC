services:
  vepc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vepc-mme-sgsn
    hostname: vepc
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
    user: "0:0"
    # Required for Linux interface operations (create-vlan/bind) on host NICs.
    network_mode: host
    volumes:
      - /etc/vepc:/etc/vepc
      - vepc-logs:/var/log/vepc
      - /var/lib/vepc:/var/lib/vepc
      - /tmp:/tmp
    environment:
      LOG_LEVEL: info
      CONFIG_PATH: /etc/vepc
      LOG_PATH: /var/log/vepc
      VEPC_TRAFFIC_PORTS: 'ens192'
      VEPC_CLI_SOCKET: /tmp/vepc.sock
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/vepc-cli", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "vepc=core"

  vepc-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: vepc-vepc-web:latest
    container_name: vepc-web
    depends_on:
      - vepc
      - db
    environment:
      NODE_ENV: production
      # allow overriding the CLI socket path and wait timeout from compose
      CLI_SOCKET: /tmp/vepc.sock
      WAIT_FOR_SOCKET_TIMEOUT: 60
    ports:
      - "3000:3000"
    volumes:
      - /tmp:/tmp:rw
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "vepc=web"

  db:
    image: mysql:8.0
    container_name: vepc-db
    environment:
      MYSQL_ROOT_PASSWORD: vepcpass
      MYSQL_DATABASE: vepc
      MYSQL_USER: vepc
      MYSQL_PASSWORD: vepcpass
    volumes:
      - vepc-db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

volumes:
  vepc-logs:
    driver: local
  vepc-db-data:
    driver: local

